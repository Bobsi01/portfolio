name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - index.html
      - styles.css
      - script.js
      - robots.txt
      - favicon.png
      - favicon.ico
      - assets/**
      - images/**
      - .github/workflows/deploy-portfolio.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy static portfolio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare deploy payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-pages
          mkdir -p .deploy-pages

          cp index.html styles.css script.js robots.txt favicon.png .deploy-pages/
          cp -R assets images .deploy-pages/

          if [ -f favicon.ico ]; then
            cp favicon.ico .deploy-pages/favicon.ico
          else
            cp favicon.png .deploy-pages/favicon.ico
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .deploy-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
